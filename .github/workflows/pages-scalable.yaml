name: Scalable Pages Build

on:
  push:
    branches:
      - main
      - "cursor/**"  # Allow testing on cursor branches
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      notebook_filter:
        description: "Regex pattern to filter notebooks (e.g., 'N-0(29|61)' for specific notebooks)"
        required: false
        default: ""
      force_rebuild:
        description: "Force rebuild all notebooks (ignore cache)"
        type: boolean
        default: false

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: "1.11"
  PLUTO_SLIDER_SERVER_VERSION: "1"

jobs:
  # First job: discover notebooks and create a build matrix
  discover-notebooks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_notebooks: ${{ steps.set-matrix.outputs.total_notebooks }}
      chunk_count: ${{ steps.set-matrix.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover Pluto notebooks and create matrix
        id: set-matrix
        run: |
          # Find all Pluto notebooks
          NOTEBOOKS=$(find notebooks -name "*.jl" -exec grep -l "^### A Pluto.jl notebook ###" {} \; 2>/dev/null | sort)
          
          # Apply filter if provided
          FILTER="${{ github.event.inputs.notebook_filter }}"
          if [ -n "$FILTER" ]; then
            echo "Applying filter: $FILTER"
            NOTEBOOKS=$(echo "$NOTEBOOKS" | grep -E "$FILTER" || true)
          fi
          
          # Count total notebooks
          TOTAL=$(echo "$NOTEBOOKS" | grep -c . || echo "0")
          echo "Found $TOTAL notebooks to build"
          echo "total_notebooks=$TOTAL" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL" -eq "0" ]; then
            echo "No notebooks found!"
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
            echo "chunk_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Create chunks of ~5 notebooks each for parallel processing
          # KEY INSIGHT: Larger chunks = less Julia startup overhead
          # Each chunk runs ALL its notebooks in ONE Julia session
          CHUNK_SIZE=5
          
          CHUNK_ID=0
          CURRENT_CHUNK=""
          COUNT=0
          MATRIX='{"include":['
          FIRST=true
          
          while IFS= read -r notebook; do
            [ -z "$notebook" ] && continue
            
            if [ $COUNT -ge $CHUNK_SIZE ]; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX="$MATRIX,"
              fi
              MATRIX="$MATRIX{\"chunk_id\":$CHUNK_ID,\"notebooks\":\"$CURRENT_CHUNK\"}"
              CHUNK_ID=$((CHUNK_ID + 1))
              CURRENT_CHUNK="$notebook"
              COUNT=1
            else
              if [ -n "$CURRENT_CHUNK" ]; then
                CURRENT_CHUNK="$CURRENT_CHUNK,$notebook"
              else
                CURRENT_CHUNK="$notebook"
              fi
              COUNT=$((COUNT + 1))
            fi
          done <<< "$NOTEBOOKS"
          
          # Don't forget the last chunk
          if [ -n "$CURRENT_CHUNK" ]; then
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              MATRIX="$MATRIX,"
            fi
            MATRIX="$MATRIX{\"chunk_id\":$CHUNK_ID,\"notebooks\":\"$CURRENT_CHUNK\"}"
            CHUNK_ID=$((CHUNK_ID + 1))
          fi
          
          MATRIX="$MATRIX]}"
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "chunk_count=$CHUNK_ID" >> $GITHUB_OUTPUT

  # Second job: Warm up Julia package cache (runs ONCE, shared by all chunks)
  # This is the KEY optimization - precompile packages once, cache for all parallel jobs
  warmup-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      # Use a STABLE cache key that doesn't change with notebook content
      - name: Cache Julia packages (stable key)
        id: julia-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          # Key based on Julia version and PlutoSliderServer version ONLY
          # This means the cache is reused across notebook changes!
          key: julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v2
          restore-keys: |
            julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-
            julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-

      - name: Precompile PlutoSliderServer (if cache miss)
        if: steps.julia-cache.outputs.cache-hit != 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          echo "Cache miss - precompiling PlutoSliderServer and dependencies..."
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            
            # Install PlutoSliderServer and trigger precompilation
            @time Pkg.add(Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"))
            
            # Force precompilation by importing
            @time using PlutoSliderServer
            
            println("✓ PlutoSliderServer precompiled successfully")
          '
        timeout-minutes: 10

      - name: Verify cache is ready
        run: |
          echo "Julia packages cached at:"
          du -sh ~/.julia/packages ~/.julia/compiled ~/.julia/artifacts 2>/dev/null || true
          echo ""
          echo "Cache hit: ${{ steps.julia-cache.outputs.cache-hit }}"

  # Third job: build notebooks in parallel using matrix strategy
  build-notebooks:
    needs: [discover-notebooks, warmup-julia]
    if: ${{ needs.discover-notebooks.outputs.total_notebooks != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue other chunks even if one fails
      max-parallel: 10  # GitHub Actions limit for free accounts
      matrix: ${{ fromJson(needs.discover-notebooks.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      # CRITICAL: Restore the SAME cache that warmup-julia created
      - name: Restore Julia packages from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v2
          restore-keys: |
            julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-
            julia-packages-${{ runner.os }}-${{ env.JULIA_VERSION }}-

      # Notebook-specific cache for exported HTML (changes when notebook content changes)
      - name: Set up notebook state cache
        uses: actions/cache@v4
        with:
          path: pluto_state_cache
          # This cache IS notebook-specific - invalidates when notebooks in this chunk change
          key: pluto-state-chunk${{ matrix.chunk_id }}-${{ hashFiles(format('{0}', matrix.notebooks)) }}
          restore-keys: |
            pluto-state-chunk${{ matrix.chunk_id }}-

      - name: Build notebooks in chunk ${{ matrix.chunk_id }}
        run: |
          echo "========================================"
          echo "Building chunk ${{ matrix.chunk_id }}"
          echo "Notebooks: ${{ matrix.notebooks }}"
          echo "========================================"
          
          mkdir -p output/notebooks
          
          # Run ALL notebooks in this chunk in a SINGLE Julia session
          # This amortizes the startup/precompilation cost across multiple notebooks
          julia --project=@. -e '
            start_time = time()
            
            using Pkg
            Pkg.activate(mktempdir())
            
            # This should be fast now - packages are already precompiled in cache
            println("Loading PlutoSliderServer...")
            load_start = time()
            Pkg.add(Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"); io=devnull)
            import PlutoSliderServer
            println("  Loaded in $(round(time() - load_start, digits=1))s")
            
            # Get notebooks from environment
            notebooks_str = ENV["NOTEBOOKS"]
            # Convert SubStrings to Strings (PlutoSliderServer requires String type)
            notebooks = String.(filter(!isempty, strip.(split(notebooks_str, ","))))
            
            println("\nBuilding $(length(notebooks)) notebooks in this chunk...")
            
            successful = String[]
            failed = String[]
            
            for (i, notebook) in enumerate(notebooks)
              println("\n" * "="^60)
              println("[$i/$(length(notebooks))] Building: $notebook")
              println("="^60)
              
              nb_start = time()
              try
                PlutoSliderServer.export_notebook(
                  notebook;
                  Export_cache_dir="pluto_state_cache",
                  Export_baked_notebookfile=false,
                  Export_baked_state=false,
                  Export_output_dir="output",
                )
                elapsed = round(time() - nb_start, digits=1)
                println("✓ Completed in $(elapsed)s")
                push!(successful, notebook)
              catch e
                elapsed = round(time() - nb_start, digits=1)
                println("✗ Failed after $(elapsed)s")
                println("Error: $e")
                push!(failed, notebook)
              end
            end
            
            total_time = round(time() - start_time, digits=1)
            
            println("\n" * "="^60)
            println("CHUNK SUMMARY")
            println("="^60)
            println("Total time: $(total_time)s")
            println("Successful: $(length(successful))")
            println("Failed: $(length(failed))")
            if !isempty(failed)
              println("\nFailed notebooks:")
              for nb in failed
                println("  - $nb")
              end
            end
          '
        env:
          NOTEBOOKS: ${{ matrix.notebooks }}
        timeout-minutes: 30

      - name: Upload chunk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-chunk-${{ matrix.chunk_id }}
          path: output/
          retention-days: 1
          if-no-files-found: warn

  # Fourth job: generate README and index
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Update README.md and convert to index.html
        run: |
          julia services/list_notebooks.jl
          sudo apt-get install -y pandoc
          pandoc README.md -s -o README.html

      - name: Upload index artifacts
        uses: actions/upload-artifact@v4
        with:
          name: index-files
          path: |
            index.html
            README.html
            styles.css
          retention-days: 1

  # Fifth job: merge all artifacts and deploy
  deploy:
    needs: [discover-notebooks, build-notebooks, generate-index]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all notebook artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: notebooks-chunk-*
          path: downloaded-notebooks
          merge-multiple: true

      - name: Download index artifacts
        uses: actions/download-artifact@v4
        with:
          name: index-files
          path: .

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy/notebooks
          
          # Copy all built notebooks
          if [ -d downloaded-notebooks/notebooks ]; then
            cp -r downloaded-notebooks/notebooks/* deploy/notebooks/ 2>/dev/null || true
          fi
          
          # Copy index files
          cp index.html deploy/ 2>/dev/null || true
          cp README.html deploy/ 2>/dev/null || true
          cp styles.css deploy/ 2>/dev/null || true
          
          echo "Deployment contents:"
          find deploy -type f | head -50
          echo ""
          echo "Total files: $(find deploy -type f | wc -l)"

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: deploy
          single-commit: true

  # Summary job to report build status and timing
  summary:
    needs: [discover-notebooks, warmup-julia, build-notebooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📊 Scalable CI Build Report
          
          ## Configuration
          - **Total notebooks:** ${{ needs.discover-notebooks.outputs.total_notebooks }}
          - **Parallel chunks:** ${{ needs.discover-notebooks.outputs.chunk_count }}
          - **Julia version:** ${{ env.JULIA_VERSION }}
          - **PlutoSliderServer:** v${{ env.PLUTO_SLIDER_SERVER_VERSION }}
          
          ## Results
          | Job | Status |
          |-----|--------|
          | Discover notebooks | ✓ |
          | Warmup Julia cache | ${{ needs.warmup-julia.result == 'success' && '✓' || '✗' }} |
          | Build notebooks | ${{ needs.build-notebooks.result == 'success' && '✓' || needs.build-notebooks.result == 'failure' && '✗ (some failed)' || '⏭ skipped' }} |
          
          ## Key Optimizations
          
          1. **Stable Julia package cache** - Packages precompiled once, reused across all chunks
          2. **Single Julia session per chunk** - Amortizes startup cost over ~5 notebooks
          3. **Parallel matrix execution** - Up to 10 chunks build simultaneously
          4. **fail-fast: false** - Other chunks continue if one fails
          
          ## Expected Performance
          
          | Metric | Old (Sequential) | New (Parallel) |
          |--------|------------------|----------------|
          | Julia startup overhead | 51x (~2min each = 102min) | 10x chunks (~2min each = 20min, parallel → ~2min) |
          | Notebook execution | Sequential (~50min) | Parallel (~5-10min) |
          | **Total estimated** | **~60-90 minutes** | **~10-15 minutes** |
          
          EOF
