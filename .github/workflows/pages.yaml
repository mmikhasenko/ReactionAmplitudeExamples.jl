name: Setup GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JULIA_VERSION: "1.11"
  PLUTO_SLIDER_SERVER_VERSION: "1"

jobs:
  # Warmup job: Ensures Julia packages are precompiled and cached
  # This runs FIRST, so the build job can restore from a warm cache
  warmup-packages:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Cache Julia packages (stable key)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v1
          restore-keys: |
            julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-
            julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-

      - name: Precompile PlutoSliderServer
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss - precompiling packages..."
          julia -e '
            using Pkg
            Pkg.activate(mktempdir())
            @time Pkg.add(Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"))
            @time using PlutoSliderServer
            println("✓ Precompilation complete")
          '

  # Main build job: Restores cache from warmup, then builds notebooks
  build-and-deploy:
    needs: warmup-packages
    runs-on: ubuntu-latest
    env:
      PYTHON: ""
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      # Restore cache (read-only) - warmup job already populated it
      - name: Restore Julia packages from cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v1
          restore-keys: |
            julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-
            julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-

      - name: Update README.md and convert to index.html, add CSS
        run: |
          julia services/list_notebooks.jl
          sudo apt-get install pandoc
          pandoc README.md -s -o README.html

      # Notebook state cache - this CAN change when notebooks change
      - name: Set up notebook state cache
        uses: actions/cache@v5
        with:
          path: pluto_state_cache
          key: ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}-${{ hashFiles('**/*jl') }}
          restore-keys: |
            ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}

      - name: Run & export Pluto notebooks
        run: |
          echo "Cache status from warmup: ${{ needs.warmup-packages.outputs.cache-hit }}"
          # delete long_running directory to hide it from PlutoSliderServer
          if [ -d "notebooks/long_running" ]; then
            rm -rf notebooks/long_running
          fi

          # Run export with error handling for cleanup phase
          # All notebooks export successfully, but cleanup may fail with Malt.TerminatedWorkerException
          set +e  # Don't exit on error
          julia -e 'using Pkg
            Pkg.activate(mktempdir())
            Pkg.add([
              Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"),
            ])

            import PlutoSliderServer

            try
              PlutoSliderServer.github_action(".";
                Export_cache_dir="pluto_state_cache",
                Export_baked_notebookfile=false,
                Export_baked_state=false,
              )
            catch e
              # Check if error is the known cleanup issue
              if occursin("Malt.TerminatedWorkerException", string(e))
                println("⚠ Warning: Cleanup phase failed with Malt.TerminatedWorkerException")
                println("   This is a known issue in PlutoSliderServer cleanup logic.")
                println("   All notebooks were successfully exported before cleanup.")
                println("   Verifying exports...")
                
                # Verify that notebooks were actually exported
                exported_count = 0
                for (root, dirs, files) in walkdir(".")
                  for file in files
                    if endswith(file, ".html") && !occursin("README.html", file) && !occursin("index.html", file)
                      exported_count += 1
                    end
                  end
                end
                
                if exported_count > 0
                  println("✓ Verified: $exported_count HTML files found. Exports successful.")
                  println("   Continuing workflow despite cleanup error.")
                else
                  println("✗ Error: No exported HTML files found. Export may have failed.")
                  rethrow(e)
                end
              else
                # Unknown error - rethrow
                rethrow(e)
              end
            end'
          export_exit_code=$?
          
          # Verify exports exist even if cleanup failed
          html_count=$(find . -name "*.html" ! -name "README.html" ! -name "index.html" | wc -l)
          if [ $html_count -gt 0 ]; then
            echo "✓ Verified: $html_count HTML files exported successfully"
            if [ $export_exit_code -ne 0 ]; then
              echo "⚠ Cleanup phase failed, but all notebooks were exported. Continuing..."
            fi
          else
            echo "✗ Error: No HTML files found. Export failed."
            exit 1
          fi
          
          set -e  # Re-enable exit on error

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .
          single-commit: true
