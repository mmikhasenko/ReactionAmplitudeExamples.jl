name: Test Parallel Build

# Tests that parallel matrix builds work correctly.
# Uses 3 notebooks split into 3 parallel jobs.

on:
  push:
    branches:
      - "cursor/ci-stage3*"
  workflow_dispatch:

env:
  JULIA_VERSION: "1.11"
  PLUTO_SLIDER_SERVER_VERSION: "1"

jobs:
  # Warmup first
  warmup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Cache packages
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v1

      - name: Precompile
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          julia -e '
            using Pkg; Pkg.activate(mktempdir())
            Pkg.add(Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"))
            using PlutoSliderServer
          '

  # Parallel builds - 3 notebooks, 3 jobs
  build:
    needs: warmup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - notebook: notebooks/N-061-complex-random-variance.jl
            name: simple
          - notebook: notebooks/N-029-introduction2complexplane.jl
            name: medium
          - notebook: notebooks/N-049-singlechannelkmatrix.jl
            name: complex
    outputs:
      time-simple: ${{ steps.timing.outputs.time-simple }}
      time-medium: ${{ steps.timing.outputs.time-medium }}
      time-complex: ${{ steps.timing.outputs.time-complex }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ env.JULIA_VERSION }}

      - name: Restore packages
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
            ~/.julia/compiled
            ~/.julia/scratchspaces
          key: julia-pkgs-${{ runner.os }}-${{ env.JULIA_VERSION }}-pss${{ env.PLUTO_SLIDER_SERVER_VERSION }}-v1

      - name: Record start
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.name }} notebook
        run: |
          julia -e '
            using Pkg; Pkg.activate(mktempdir())
            Pkg.add(Pkg.PackageSpec(name="PlutoSliderServer", version="'${{ env.PLUTO_SLIDER_SERVER_VERSION }}'"); io=devnull)
            import PlutoSliderServer
            mkdir("output")
            PlutoSliderServer.export_notebook("${{ matrix.notebook }}";
              Export_cache_dir="cache",
              Export_baked_notebookfile=false,
              Export_baked_state=false,
              Export_output_dir="output",
            )
          '
        timeout-minutes: 15

      - name: Record time
        id: timing
        run: |
          END=$(date +%s)
          START=${{ steps.start.outputs.time }}
          echo "time-${{ matrix.name }}=$((END - START))" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-${{ matrix.name }}
          path: output/

  # Report timing comparison
  report:
    needs: [warmup, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-notebooks
          merge-multiple: true

      - name: Timing report
        run: |
          # Get job timing from API
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # Parallel Build Test Results
          
          ## Jobs
          | Job | Status |
          |-----|--------|
          | Warmup | ✅ Cache: ${{ needs.warmup.outputs.cache-hit }} |
          | Build (simple) | ${{ needs.build.result == 'success' && '✅' || '❌' }} |
          | Build (medium) | ${{ needs.build.result == 'success' && '✅' || '❌' }} |
          | Build (complex) | ${{ needs.build.result == 'success' && '✅' || '❌' }} |
          
          ## Key Evidence
          
          1. **All 3 build jobs ran in PARALLEL** (check job graph in Actions UI)
          2. **Wall clock time** = max(job times), NOT sum
          3. **Each job restored from warmup cache** (fast package load)
          
          ## Artifacts Built
          EOF
          
          echo '```' >> $GITHUB_STEP_SUMMARY
          find all-notebooks -name "*.html" -type f 2>/dev/null || echo "No HTML files found"
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          
          ## Scaling Interpretation
          
          With 51 notebooks split into 11 chunks of ~5 each:
          - **Sequential**: 51 × (load + build) = very long
          - **Parallel**: warmup + max(11 chunk times) = much shorter
          
          The parallel approach scales horizontally with GitHub Actions runners.
          EOF
